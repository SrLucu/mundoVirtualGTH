<!DOCTYPE html>

<html>
<head>
<title>nFUSION-ART</title>
<script src="https://aframe.io/releases/1.7.0/aframe.min.js">
</script>
<style>
      body {
        margin: 0;
        font-family: 'Arial Black', Arial, sans-serif;
        background: #ffffff;
      }
      
      /* Panel de control para cambiar vistas */
      .view-controls {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 1000;
      background: rgba(0, 0, 0, 0.8);
      border: 2px solid #f700ff;
      color: #ff01ea;
      padding: 16px;
      border-radius: 10px;
    }
    .view-controls h4 {
      margin-bottom: 12px;
      font-size: 14px;
    }
    .view-controls button {
      display: block;
      width: 100%;
      margin: 6px 0;
      padding: 10px;
      background: transparent;
      border: 1px solid rgb(204, 0, 255);
      border-radius: 5px;
      color: #ffffff;
      cursor: pointer;
      font-size: 13px;
    }
    .view-controls button:hover {
      background: #fcfcfc;
      color: #000;
    }
          #ui-panel {
        position: 0 4 0;
        top: 80px;
        right: 20px;
        width: 300px;
        display: none;
        flex-direction: column;
        gap: 15px;
        z-index: 10;
        background-color: rgba(255, 255, 255, 0.95);
        border-radius: 15px;
        padding: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      }

      .card {
        border-radius: 10px;
        padding: 15px;
        background: #f3f3f3;
        box-shadow: 0 3px 6px rgba(0,0,0,0.1);
        transition: transform 0.3s;
      }

      .card:hover {
        transform: scale(1.03);
        background: #eaeaea;
      }

      .card h3 {
        margin: 0 0 10px;
      }

      @media screen and (max-width: 800px) {
        #ui-panel {
          align-items: center;
          width: 90%;
          right: 5%;
        }
      }
   
    </style>
</head>

<script>
  
// ==========================
// CARRUSELES POR SECCIÓN
// ==========================
const carousels = ['photo', 'tattoo', 'dj', 'concert'];

carousels.forEach(section => {
  const carousel = document.querySelector(`#carousel-${section}`);
  const container = document.querySelector(`#card-${section}-container`);
  const toggleBtn = document.querySelector(`#btn-${section}`);
  const nextBtn = document.querySelector(`#next-${section}`);
  const prevBtn = document.querySelector(`#prev-${section}`);

  let offset = 0;
  let visible = false;

  if (nextBtn && prevBtn) {
    nextBtn.addEventListener('click', () => {
      offset -= 5;
      container.setAttribute('position', `${offset} 0 0`);
    });

    prevBtn.addEventListener('click', () => {
      offset += 5;
      container.setAttribute('position', `${offset} 0 0`);
    });
  }

  if (toggleBtn) {
    toggleBtn.addEventListener('click', () => {
      visible = !visible;

      if (visible) {
        carousel.setAttribute('visible', true);
        carousel.setAttribute('animation__scale', {
          property: 'scale',
          from: '0 0 0',
          to: '1 1 1',
          dur: 600,
          easing: 'easeOutBack'
        });
      } else {
        carousel.setAttribute('animation__scale', {
          property: 'scale',
          from: '1 1 1',
          to: '0 0 0',
          dur: 400,
          easing: 'easeInBack'
        });
        setTimeout(() => {
          carousel.setAttribute('visible', false);
        }, 400);
      }
    });
  }
});


  

  // ==========================
  // VISTAS PERSONALIZADAS
  // ==========================
  const viewConfigs = {
    overview: { position: '0 25 40', rotation: '-20 0 0', description: 'Vista general de todas las estaciones'},
    photo: { position: '0 5 -120', rotation: '0 -45 0', description: 'Enfoque en la estación de fotografía' },
    tattoo: { position: '0 3 130', rotation: '0 180 0', description: 'Vista de la zona de tatuajes' },
    dj: { position: '-150 3 0', rotation: '0 0 0', description: 'Frente a la estación de DJ' },
    concert: { position: '150 3 0', rotation: '0 180 0', description: 'Vista del escenario de conciertos' },
    aerial: { position: '0 50 0', rotation: '-90 0 0', description: 'Vista aérea completa' },
    cinematic: { position: '0 3 50', rotation: '0 0 0', description: 'Vista cinemática dramática' }
  };

  const camera = document.querySelector('#camera', '#camera');

  function setView(viewName) {
    const config = viewConfigs[viewName];
    if (!config) return;

    camera.setAttribute('animation__position', {
      property: 'position',
      to: config.position,
      dur: 2000,
      easing: 'easeInOutQuad'
    });

    camera.setAttribute('animation__rotation', {
      property: 'rotation',
      to: config.rotation,
      dur: 2000,
      easing: 'easeInOutQuad'
    });

    console.log(`📷 Vista cambiada a: ${viewName} - ${config.description}`);
  }

  document.addEventListener('keydown', function (event) {
    switch (event.key) {
      case '1': setView('overview'); break;
      case '2': setView('photo'); break;
      case '3': setView('tattoo'); break;
      case '4': setView('dj'); break;
      case '5': setView('concert'); break;
      case '6': setView('aerial'); break;
      case '7': setView('cinematic'); break;
    }
  });

  // Vista inicial automática
  setTimeout(() => {
    setView('overview');
  }, 1000);
</script>
</body>
</html>
